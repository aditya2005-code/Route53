name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "backend", "frontend" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-ci:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          JWT_SECRET_KEY: "a_secure_jwt_secret_key_used_exclusively_for_ci_pipeline_verification"
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          rm -f ci_test.db

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "a_secure_jwt_secret_key_used_exclusively_for_ci_pipeline_verification"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          python -m pytest -v

  frontend-ci:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-ci:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: route53-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: route53-frontend:ci-test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
